<body>

<header class="header">
    <div class="logo">
        <i class="fas fa-bridge"></i>
        <span>SkillBridge</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="provider.html">Become a Provider</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="provider-profile">

    <div class="cover-image"></div>

    <div class="profile-card">

        <img id="profileImage"
             src="images/default-provider.png"
             class="profile-photo">

        <h1 id="businessName">Loading...</h1>

        <div class="verified-badge">
            ✓ VERIFIED PROVIDER
        </div>

        <div id="rating">
            ⭐ 0.0
        </div>

        <div id="skillScore">
            🏆 SkillScore 50
        </div>

        <p id="category"></p>

        <p id="experience"></p>

        <p id="location"></p>

        <p id="businessHours"></p>

        <p id="description"></p>

        <div class="profile-buttons">

            <a id="callButton">
                <button class="call-btn">
                    📞 Call
                </button>
       <a id="emailButton">

       <button class="email-btn">

              📧 Email

            </button>

             </a>
            </a>

            <a id="whatsappButton" target="_blank">
                <button class="whatsapp-btn">
                    💬 WhatsApp
                </button>
            </a>

        </div>

    </div>

</section>

<section class="quote-section">

    <h2>Request a Quote</h2>

    <input
        type="text"
        id="customerName"
        placeholder="Your Name">

    <input
        type="tel"
        id="customerPhone"
        placeholder="Phone Number">

    <input
        type="text"
        id="customerLocation"
        placeholder="Your Location">

    <input
        type="date"
        id="preferredDate">

    <textarea
        id="jobDescription"
        placeholder="Describe the work you need..."></textarea>

    <button onclick="requestQuote()">
        Send Request
    </button>

</section>
<section class="reviews">

<h2>Customer Reviews</h2>
<div class="review-form">

    <input
        type="text"
        id="reviewName"
        placeholder="Your Name">

<section class="portfolio">

<h2>Portfolio</h2>

<div id="portfolioGallery" class="gallery">

<p>No portfolio images uploaded yet.</p>

</div>

</section>

    <select id="reviewRating">

        <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
        <option value="4">⭐⭐⭐⭐ Very Good</option>
        <option value="3">⭐⭐⭐ Good</option>
        <option value="2">⭐⭐ Fair</option>
        <option value="1">⭐ Poor</option>

    </select>

    <textarea
        id="reviewComment"
        placeholder="Share your experience..."></textarea>

    <button onclick="submitReview()">

        Submit Review

    </button>

<div id="reviewsList">

No reviews yet.

</div>

</section>

</body>

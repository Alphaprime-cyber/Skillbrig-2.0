<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Provider Profile | SkillBridge</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">
<i class="fas fa-bridge"></i>
<span>SkillBridge</span>
</div>

<nav>

<a href="index.html">Home</a>
<a href="provider.html">Become a Provider</a>
<a href="contact.html">Contact</a>

</nav>

</header>

<section class="provider-profile">

<div class="cover-image">

<img id="coverImage"
src="images/default-cover.jpg"
alt="Cover Image">

</div>

<div class="profile-card">

<img
id="profileImage"
src="images/default-provider.png"
class="profile-photo">

<h1 id="businessName">

Loading...

</h1>

<div class="verified-badge">

✅ VERIFIED PROVIDER

</div>

<p id="rating">

⭐ 0.0

</p>

<p id="skillScore">

🏆 SkillScore 50

</p>

<p id="category"></p>

<p id="experience"></p>

<p id="location"></p>

<p id="businessHours"></p>

<p id="description"></p>

<hr>

<p>

<strong>Member Since:</strong>

<span id="memberSince">

2026

</span>

</p>

<p>

<strong>Total Reviews:</strong>

<span id="totalReviews">

0

</span>

</p>

<p>

<strong>Jobs Completed:</strong>

<span id="jobsCompleted">

0

</span>

</p>

<div class="profile-buttons">

<a id="callButton">

<button class="call-btn">

📞 Call

</button>

</a>

<a
id="whatsappButton"
target="_blank">

<button class="whatsapp-btn">

💬 WhatsApp

</button>

</a>

<a id="emailButton">

<button class="email-btn">

📧 Email

</button>

</a>

</div>

</div>

</section>

<section class="quote-section">

<h2>

Request a Quote

</h2>

<input
type="text"
id="customerName"
placeholder="Your Name">

<input
type="tel"
id="customerPhone"
placeholder="Phone Number">

<input
type="text"
id="customerLocation"
placeholder="Your Location">

<input
type="date"
id="preferredDate">

<textarea
id="jobDescription"
placeholder="Describe the work you need..."></textarea>

<button onclick="requestQuote()">

Send Request

</button>

</section>

<section class="portfolio">

<h2>

Portfolio

</h2>

<div
id="portfolioGallery"
class="gallery">

<p>

No portfolio uploaded yet.

</p>

</div>

</section>

<section class="reviews">

<h2>

Customer Reviews

</h2>

<div class="review-form">

<input
type="text"
id="reviewName"
placeholder="Your Name">

<select id="reviewRating">

<option value="5">⭐⭐⭐⭐⭐ Excellent</option>
<option value="4">⭐⭐⭐⭐ Very Good</option>
<option value="3">⭐⭐⭐ Good</option>
<option value="2">⭐⭐ Fair</option>
<option value="1">⭐ Poor</option>

</select>

<textarea
id="reviewComment"
placeholder="Share your experience..."></textarea>

<button onclick="submitReview()">

Submit Review

</button>

</div>

<div id="reviewsList">

<p>

No reviews yet.

</p>

</div>

</section>

<footer class="footer">

<p>

© 2026 SkillBridge. All Rights Reserved.

</p>

</footer>

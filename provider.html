<header>
    <h1>Become a Service Provider</h1>
    <p>Join SkillBridge and connect with customers across Nigeria.</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="container">

<h2>Register as a Service Provider</h2>

<input id="providerName" type="text" placeholder="Full Name"><br><br>

<input id="businessName" type="text" placeholder="Business Name (Optional)"><br><br>

<select id="providerCategory">
    <option value="">Select Category</option>
    <option>Plumbing</option>
    <option>Electrical</option>
    <option>Carpentry</option>
    <option>Cleaning</option>
    <option>Tailoring</option>
    <option>Fashion Design</option>
    <option>Phone Repair</option>
    <option>Computer Repair</option>
    <option>Graphic Design</option>
    <option>Web Development</option>
    <option>Catering</option>
    <option>Photography</option>
    <option>Auto Mechanic</option>
    <option>Hair Dressing</option>
    <option>Barbing</option>
</select>

<br><br>

<select id="providerState">
    <option value="">Select State</option>
    <option>Lagos</option>
    <option>Abuja (FCT)</option>
    <option>Rivers</option>
    <option>Kano</option>
    <option>Oyo</option>
    <option>Enugu</option>
    <option>Delta</option>
    <option>Kaduna</option>
</select>

<br><br>

<input id="providerLocation" type="text" placeholder="City / LGA"><br><br>

<input id="providerPhone" type="tel" placeholder="Phone Number"><br><br>

<input id="providerEmail" type="email" placeholder="Email Address"><br><br>

<textarea id="providerDescription"
placeholder="Describe your services..."
rows="5"
style="width:300px;"></textarea>
<input id="providerExperience" type="number" placeholder="Years of Experience"><br><br>

<input id="providerBusinessHours" type="text" placeholder="Business Hours (e.g. Mon–Sat, 8AM–6PM)"><br><br>

<input id="providerWhatsApp" type="text" placeholder="WhatsApp Number"><br><br>
<br><br>

<button id="registerProviderBtn">
Register Now
</button>

</div>

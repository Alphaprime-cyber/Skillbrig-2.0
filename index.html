<!DOCTYPE html>
<html>
<head>
        <title>SkillBridge</title>
        <link rel="stylesheet" href="style.css">
</head>

<body>

<header style="background:#008080;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.2);">

<h1 style="margin:0;font-size:35px;color:white;">
🛠 SkillBridge
</h1>

<p style="color:white;margin-top:8px;">
Connecting Customers with Trusted Professionals
</p>

<div style="margin-top:15px;">

<a href="#" style="color:white;text-decoration:none;margin:15px;">Home</a>

<a href="#" style="color:white;text-decoration:none;margin:15px;">Services</a>

<a href="#" style="color:white;text-decoration:none;margin:15px;">Become an Artisan</a>

<a href="#" style="color:white;text-decoration:none;margin:15px;">Contact</a>

</div>

</header>

<br>

<!-- SEARCH -->
<input type="text" placeholder="Search for services...">
<button>Search</button>

<hr>

<!-- LOGIN -->
<h2>Login / Sign Up</h2>

<input id="email" type="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>

<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>

<hr>

<!-- POST SERVICE -->
<h2>Post Your Service</h2>

<input id="serviceName" type="text" placeholder="Service Name"><br>

<input id="serviceCategory" type="text" placeholder="Category"><br>

<input id="serviceLocation" type="text" placeholder="Location"><br>

<input id="servicePhone" type="text" placeholder="Phone Number"><br>

<input id="serviceRating" type="number" placeholder="Rating (1-5)"><br>

<button onclick="addService()">Post Service</button>

<hr>

<!-- SERVICES -->
<h2>Available Services</h2>

<div id="servicesList">
    Loading services...
</div>

<hr>

<!-- POPULAR SERVICES -->
<h2>Popular Services</h2>

<div class="card">Plumbing</div>
<div class="card">Tailoring</div>
<div class="card">Cleaning</div>
<div class="card">Graphic Design</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc
}
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgV-0KaUdjHyy_YPYRogunS5H01jPBbGg",
  authDomain: "skillbridge-app-56faf.firebaseapp.com",
  projectId: "skillbridge-app-56faf",
  storageBucket: "skillbridge-app-56faf.firebasestorage.app",
  messagingSenderId: "181813326765",
  appId: "1:181813326765:web:4732292cd467a8f7d3a724"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.signup = function () {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Signup successful!");
    })
    .catch(error => {
      alert(error.message);
    });
};

window.login = function () {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Login successful!");
    })
    .catch(error => {
      alert(error.message);
    });
};

window.addService = async function () {

  const name = document.getElementById("serviceName").value;
  const category = document.getElementById("serviceCategory").value;
  const location = document.getElementById("serviceLocation").value;
  const rating = document.getElementById("serviceRating").value;
const phone = document.getElementById("servicePhone").value.trim();

  if (!name || !category || !location || !phone || !rating) {
  alert("Please fill in all fields.");
  return;
}

  try {

await addDoc(collection(db, "services"), {
  name,
  category,
  location,
  phone,
  rating: Number(rating)
});
    

    alert("Service posted successfully!");

    document.getElementById("serviceName").value = "";
    document.getElementById("serviceCategory").value = "";
    document.getElementById("serviceLocation").value = "";
    document.getElementById("serviceRating").value = "";

document.getElementById("servicePhone").value = "";
    loadServices();

  } catch (error) {
    alert(error.message);
  }
};

async function loadServices() {

  try {

    const querySnapshot = await getDocs(collection(db, "services"));

    let output = "";

    querySnapshot.forEach((doc) => {

      const data = doc.data();

     output += `
  <div class="card">
    <h3>${data.name}</h3>
    <p><strong>Category:</strong> ${data.category}</p>
    <p><strong>Location:</strong> ${data.location}</p>
    <p><strong>Phone:</strong> ${data.phone}</p>
<p>⭐ ${data.rating}</p>

<a href="https://wa.me/${data.phone}" target="_blank">
    <button>💬 Chat on WhatsApp</button>
</a>
  </div>
`; 
    });

    if (output === "") {
      output = "<p>No services available yet.</p>";
    }

    document.getElementById("servicesList").innerHTML = output;

  } catch (error) {

    console.error(error);

    document.getElementById("servicesList").innerHTML =
      "<p>Error loading services.</p>";
  }
}

loadServices();

</script>

</body>
</html>

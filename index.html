
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillBridge</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
🛠 <span>SkillBridge</span>
</div>

<nav>

<a href="index.html">Home</a>

<a href="services.html">Services</a>

<a href="contact.html">Contact</a>

<a href="provider.html">Become a Service Provider</a>

</nav>

</header>

<section class="hero">

<h1>Find Trusted Artisans Near You</h1>

<p>
Hire verified professionals for every job,
from plumbing to web development.
</p>

<div class="search-box">
<input
  id="searchBox"
  type="text"
  placeholder="🔍 Search by service, category, state or city..."
  style="width:300px;"
  onkeyup="searchServices()">

<button onclick="searchServices()">Search</button>

<button onclick="loadServices()">Clear</button>

</div>

</section>

<section class="categories">

<h2>Popular Categories</h2>

<div id="categoryContainer">

</div>

</section>

<section class="auth">

<h2>Login / Sign Up</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<div>

<button onclick="signup()">

Sign Up

</button>

<button onclick="login()">

Login

</button>

</div>

</section>

<section class="post-service">

<h2>Post Your Service</h2>

<input id="serviceName" type="text" placeholder="Business / Service Name">

<select id="serviceCategory">

<option value="">Select Category</option>

<option>Plumbing</option>
<option>Electrical</option>
<option>Carpentry</option>
<option>Painting</option>
<option>Cleaning</option>
<option>Tailoring</option>
<option>Fashion Design</option>
<option>Hair Dressing</option>
<option>Phone Repair</option>
<option>Computer Repair</option>
<option>Graphic Design</option>
<option>Web Development</option>
<option>Photography</option>
<option>Catering</option>

</select>

<select id="serviceState">

<option value="">Select State</option>

<option>Lagos</option>
<option>Abuja (FCT)</option>
<option>Rivers</option>
<option>Kano</option>
<option>Oyo</option>
<option>Kaduna</option>
<option>Enugu</option>
<option>Delta</option>
<option>Ogun</option>
<option>Anambra</option>

</select>

<input id="serviceLocation" type="text" placeholder="City / LGA">

<input id="servicePhone" type="text" placeholder="Phone Number">

<textarea
id="serviceDescription"
placeholder="Describe your service"
rows="4"></textarea>

<button onclick="addService()">

Post Service

</button>

</section>

<section>

<h2>Available Services</h2>

<div id="servicesList">

Loading services...

</div>

</section>

<footer>

<p>

© 2026 SkillBridge

</p>

</footer>

<script type="module" src="app.js"></script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillBridge</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
🛠 <span>SkillBridge</span>
</div>

<nav>

<a href="index.html">Home</a>

<a href="services.html">Services</a>

<a href="contact.html">Contact</a>

<a href="#">Become an Artisan</a>

</nav>

</header>

<section class="hero">

<h1>Find Trusted Artisans Near You</h1>

<p>
Hire verified professionals for every job,
from plumbing to web development.
</p>

<div class="search-box">

<input
type="text"
id="searchBox"
placeholder="Search for any service...">

<button onclick="searchServices()">

Search

</button>

</div>

</section>

<section class="categories">

<h2>Popular Categories</h2>

<div id="categoryContainer">

</div>

</section>

<section class="auth">

<h2>Login / Sign Up</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<div>

<button onclick="signup()">

Sign Up

</button>

<button onclick="login()">

Login

</button>

</div>

</section>

<section class="post-service">

<h2>Post Your Service</h2>

<form id="serviceForm">

</form>

</section>

<section>

<h2>Available Services</h2>

<div id="servicesList">

Loading services...

</div>

</section>

<footer>

<p>

© 2026 SkillBridge

</p>

</footer>

<script type="module" src="app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillBridge Admin Portal</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0b6b5e">
</head>

<body>

<section class="admin-login">

<div class="login-box">

<div class="admin-logo">
<i class="fas fa-user-shield"></i>
</div>

<h1>SkillBridge Admin</h1>

<p>
Restricted Area. Authorized Administrators Only.
</p>

<input
type="email"
id="adminEmail"
placeholder="Admin Email">

<input
type="password"
id="adminPassword"
placeholder="Password">

<button onclick="adminLogin()">
<i class="fas fa-lock"></i>
Secure Login
</button>

<div id="adminMessage"></div>

</div>

</section>

<script type="module" src="../app.js"></script>
<script src="../js/password-toggle.js" defer></script>

<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(console.warn));}</script>
</body>

</html>

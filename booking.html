<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book a Professional | SkillBridge</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="booking">

<h1>Book a Professional</h1>

<input
type="text"
id="customerName"
placeholder="Your Name">

<input
type="tel"
id="customerPhone"
placeholder="Phone Number">

<input
type="date"
id="bookingDate">

<input
type="time"
id="bookingTime">

<textarea
id="bookingDetails"
placeholder="Describe the job"></textarea>

<button onclick="bookProvider()">

Book Appointment

</button>

</section>

<script type="module" src="js/booking.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | SkillBridge</title>

    <meta
        name="description"
        content="SkillBridge administrator login."
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="site-header">

    <a
        href="index.html"
        class="logo"
    >

        <span class="logo-icon">

            <i class="fas fa-link"></i>

        </span>

        <span>
            Skill<span>Bridge</span>
        </span>

    </a>


    <div class="header-actions">

        <a
            href="index.html"
            class="provider-btn"
        >

            <i class="fas fa-house"></i>

            Back to Website

        </a>

    </div>

</header>



<!-- =========================================
     LOGIN
========================================= -->

<section
    class="section"
    style="min-height:70vh;display:flex;align-items:center;"
>

    <div
        class="card"
        style="
            max-width:500px;
            width:100%;
            margin:0 auto;
            padding:35px;
        "
    >


        <div
            class="section-heading centered"
            style="margin-bottom:30px;"
        >

            <div>

                <div class="section-label">

                    <i class="fas fa-shield-halved"></i>

                    ADMINISTRATION

                </div>


                <h2>
                    Admin Login
                </h2>


                <p>
                    Sign in to manage the SkillBridge marketplace.
                </p>

            </div>

        </div>



        <!-- EMAIL -->

        <label for="adminEmail">

            Email Address

        </label>


        <input
            id="adminEmail"
            type="email"
            placeholder="admin@skillbridge.com"
            autocomplete="username"
        >



        <!-- PASSWORD -->

        <label for="adminPassword">

            Password

        </label>


        <input
            id="adminPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >



        <!-- MESSAGE -->

        <p
            id="loginMessage"
            style="
                min-height:24px;
                margin-top:15px;
                text-align:center;
            "
        ></p>



        <!-- LOGIN BUTTON -->

        <button
            type="button"
            class="search-btn"
            onclick="adminLogin()"
            style="
                width:100%;
                margin-top:10px;
            "
        >

            <i class="fas fa-right-to-bracket"></i>

            Login to Admin Dashboard

        </button>


    </div>

</section>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="footer">

    <div class="footer-bottom">

        <span>
            © 2026 SkillBridge. All Rights Reserved.
        </span>

        <span>
            Admin Portal
        </span>

    </div>

</footer>



<!-- =========================================
     ADMIN LOGIN SCRIPT
========================================= -->

<script
    type="module"
    src="js/admin-login.js"
></script>


</body>

</html>

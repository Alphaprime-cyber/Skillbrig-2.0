<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | SkillBridge</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<section
    class="section"
    style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
    "
>


    <div
        class="card"
        style="
            width:100%;
            max-width:450px;
            padding:35px;
        "
    >


        <div
            style="
                text-align:center;
                margin-bottom:30px;
            "
        >

            <div class="logo">

                <span class="logo-icon">
                    <i class="fas fa-link"></i>
                </span>

                <span>
                    Skill<span>Bridge</span>
                </span>

            </div>


            <h1>
                Admin Login
            </h1>


            <p>
                Sign in to manage SkillBridge.
            </p>

        </div>



        <label>
            Email Address
        </label>


        <input
            type="email"
            id="adminEmail"
            placeholder="admin@skillbridge.com"
            required
        >



        <label>
            Password
        </label>


        <input
            type="password"
            id="adminPassword"
            placeholder="Enter your password"
            required
        >



        <button
            type="button"
            class="search-btn"
            onclick="adminLogin()"
            style="
                width:100%;
                margin-top:20px;
            "
        >

            <i class="fas fa-right-to-bracket"></i>

            Login to Dashboard

        </button>



        <div
            style="
                text-align:center;
                margin-top:25px;
            "
        >

            <a href="index.html">
                ← Back to SkillBridge
            </a>

        </div>


    </div>


</section>



<script
    type="module"
    src="js/admin-login.js"
></script>


</body>

</html>
